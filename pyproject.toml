[project]
name = "tally"
version = "0.1.0"
description = "Count the words in a text"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tabulate>=0.9,<0.10",
]

[project.scripts]
tally = "tally:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]
docs = [
    "mdformat>=1.0.0",
]

[tool.ruff]
line-length = 100

[tool.uv]
default-groups = ["dev", "docs"]

[tool.uv.workspace]
members = [
    "packages/talib",
]
